        async function plotVehicles(line)

            const svgNS = "http://www.w3.org/2000/svg";

                                break;
                            case 1:

                                stopElement.setAttribute("fill", "red");
                                break;
                            case 2:
                                // 2 = in transit to
                                stopElement.setAttribute("fill", "green");
                                break;

        async function draw()
        {
            const svgNS = "http://www.w3.org/2000/svg";
            const g = document.querySelector("g");

            const rshapes = await fetch("gtfs_subway/shapes.txt");
            const tshapes = await rshapes.text();
            const lshapes = tshapes.split('\r\n');
            putmsg(lshapes.length);
            let currentSid = "";
            let lastX = 0;
            let lastY = 0;
            lshapes.forEach((l,i) => {
                if(i > 0) {
                    const tokens = l.split(",");
                    const sid = tokens[0];
                    let  px = parseFloat(tokens[3]); // negative, 73.70
                    let  py = parseFloat(tokens[2]); // positive, 40.47
                    px *= -1.0;
                    px -= originx;
                    py -= originy;
                    px *= scaling;
                    py *= scaling;
                    if(sid !== currentSid) {
                        // new shape starting
                        //<line x1="10" y1="10" x2="90" y2="90" stroke="black" stroke-width="2" />
                        lastX = px;
                        lastY = py;
                        currentSid = sid;
                    } else {
                        const line = document.createElementNS(svgNS, "line");
                        line.setAttribute("x1", lastX);
                        line.setAttribute("y1", lastY);
                        line.setAttribute("x2", px);
                        line.setAttribute("y2", py);
                        line.setAttribute("stroke", "#ccc");
                        line.setAttribute("stroke-width", "1");
                        line.setAttribute("vector-effect", "non-scaling-stroke");
                        g.appendChild(line);
                        lastX = px;
                        lastY = py;
                    }
                }
            });

            const r = await fetch("gtfs_subway/stops.txt");
            const t = await r.text();
            const lines = t.split('\r\n');
            putmsg(lines.length);
            lines.forEach((l, i) => {
                if(i > 0)
                {
                    const tokens = l.split(',');
                    stops.push({
                        stop_id: tokens[0],
                        stop_name: tokens[1],
                        stop_lat: tokens[2],
                        stop_lon: tokens[3],
                        location_type: tokens[4],
                        parent_station: tokens[5]
                    });
                    if(tokens[2] !== undefined && tokens[3] !== undefined && tokens[4] !== '1')
                    {
                        //<rect x="50" y="30" width="300" height="120" fill="blue" />
                        //const circle = document.createElementNS(svgNS, "circle");
                        const circle = document.createElementNS(svgNS, "rect");
                        circle.setAttribute("id", `stop_${tokens[0]}`);
                        let  px = parseFloat(tokens[3]); // negative, 73.70
                        let  py = parseFloat(tokens[2]); // positive, 40.47
                        px *= -1.0;
                        px -= originx;
                        py -= originy;
                        px *= scaling;
                        py *= scaling;
                        if(tokens[0].endsWith("N"))
                        {
                            circle.setAttribute("x", px - 6);
                            circle.setAttribute("y", py - 4);
                        } else {
                            circle.setAttribute("x", px);
                            circle.setAttribute("y", py - 4);
                        }
                        circle.setAttribute("width", 6);
                        circle.setAttribute("height", 8);
                        //circle.setAttribute("cx", px.toFixed(6));
                        //circle.setAttribute("cy", py.toFixed(6));
                        circle.setAttribute("stroke", "none");
                        //circle.setAttribute("r", "4");
                        circle.setAttribute("fill", "#999");
                        //circle.setAttribute("stroke-width", "1");
                        //circle.setAttribute("vector-effect", "non-scaling-stroke");
                        g.appendChild(circle);
                    }
                }
            });

            trainLines.forEach(async (line) => {
                await plotVehicles(line);
            });
        }
        (async () => {
            draw();
            const svge = document.querySelector("svg");
            svge.addEventListener("keypress", (evt) => {
                switch(evt.keyCode) {
                    case 97: // left
                        tx -= 20;
                        break;
                    case 100: // right
                        tx += 20;
                        break;
                    case 119:
                        ty -= 20;
                        break;
                    case 115:
                        ty += 20;
                        break;
                    case 113:
                        sc -= 0.1;
                        break;
                    case 122:
                        sc += 0.1;
                        break;
                    default:
                        console.log(evt.keyCode);
                        break;
                }
                const g = document.querySelector("g");
                g.setAttribute("transform", `scale(${sc} ${sc}) translate(${tx} ${ty})`);
                console.log(sc);
            });

            setTimeout(() => {
                onTimeout();
            }, 3000);

        })();
