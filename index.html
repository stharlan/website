<html lang="en-us">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>stuartharlan.org</title>
        <link rel="icon" type="image/x-icon" href="sh_spooky_favicon.ico">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <style>
            body, html {
                font-family: "Roboto Mono", monospace;
                background-color: black;
                color:white;
            }
            /* Container or body with a dark background */
            .dark-container {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            }

            /* 1. Unvisited link */
            .dark-container a:link {
            color: #66b2ff; /* Bright light blue for high contrast */
            text-decoration: underline;
            }

            /* 2. Visited link */
            .dark-container a:visited {
            color: #b388ff; /* Light purple */
            }

            /* 3. Mouse-over/Hover link */
            .dark-container a:hover {
            color: #99ff99; /* Light green on hover */
            text-decoration: none; /* Removes underline on hover if preferred */
            }

            /* 4. Active/Clicked link */
            .dark-container a:active {
            color: #ff9999; /* Light red when actively clicked */
            }
        </style>
    </head>

        </div>
    </body>
